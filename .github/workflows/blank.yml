name: Build Remote Sound APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ============ JOB 1: BUILD DEBUG ============
  build-debug:
    name: 🔨 Build Debug APK
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🔧 Cấp quyền gradlew
        run: chmod +x ./gradlew

      - name: 🏗️ Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RemoteSound-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

  # ============ JOB 2: BUILD RELEASE (có ký) ============
  build-release:
    name: 🚀 Build Release APK
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🔐 Giải mã Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/release-key.jks
          ls -lh ${{ github.workspace }}/release-key.jks

      - name: 🔧 Cấp quyền gradlew
        run: chmod +x ./gradlew

      - name: 🏗️ Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: 🧹 Xóa keystore (bảo mật)
        if: always()
        run: rm -f ${{ github.workspace }}/release-key.jks

      - name: 📤 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RemoteSound-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: 🎉 Tạo GitHub Release (khi có tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
